spring:
  application:
    name: bcbs-member-platform

  datasource:
    url: jdbc:postgresql://localhost:5433/bcbs
    username: bcbs_user
    password: bcbs_password

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

  info:
    env:
      enabled: true

info:
  app:
    name: BCBS Member Platform
    description: Member management POC
    version: 1.0.0