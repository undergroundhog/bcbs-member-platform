spring:
  application:
    name: bcbs-member-platform

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/bcbs}
    username: ${SPRING_DATASOURCE_USERNAME:bcbs_user}
    password: ${SPRING_DATASOURCE_PASSWORD:bcbs_password}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

  info:
    build:
      enabled: true

info:
  app:
    name: BCBS Member Platform
    description: Member management POC
    version: 1.0.0

server:
  address: 0.0.0.0
  port: ${PORT:8080}