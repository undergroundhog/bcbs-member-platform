services:
  postgres:
    image: postgres:16
    container_name: bcbs-postgres
    environment:
      POSTGRES_DB: bcbs
      POSTGRES_USER: bcbs_user
      POSTGRES_PASSWORD: bcbs_password
    ports:
      - "5433:5432"
    volumes:
      - bcbs-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bcbs_user -d bcbs"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bcbs
      SPRING_DATASOURCE_USERNAME: bcbs_user
      SPRING_DATASOURCE_PASSWORD: bcbs_password
    depends_on:
      - postgres

volumes:
  bcbs-postgres-data: