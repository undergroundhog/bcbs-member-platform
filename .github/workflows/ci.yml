name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: mvn clean test

      - name: Package application
        run: mvn package -DskipTests

      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: bcbs-member-platform
          path: target/*.jar
          if-no-files-found: error

      - name: Build Docker image
        run: docker build -t ghcr.io/undergroundhog/bcbs-member-platform:${{github.sha}} -t ghcr.io/undergroundhog/bcbs-member-platform:latest .

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        run: |
          docker push ghcr.io/undergroundhog/bcbs-member-platform:${{github.sha}}
          docker push ghcr.io/undergroundhog/bcbs-member-platform:latest

      - name: Deploy exact image to Render
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          curl --fail --show-error --silent \
          --get \
          --data-urlencode "imgURL=ghcr.io/undergroundhog/bcbs-member-platform:${{github.sha}}" \
          "${{ secrets.RENDER_DEPLOY_HOOK_URL}}"
      
      - name: Verify Render deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: | 
          echo "Waiting for Render deployment to become healthy..."
          for i in {1...30}; do
            STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              'https://bcbs-member-platform-latest.onrender.com/actuator/health')
            
            if [["$STATUS" = "200" ]]; then
              echo "Render deployment is healthy"
              exit 0
            fi
          
            echo "Attempt $i: health check returned HTTP $STATUS"
            sleep 10
          done
          
          echo "Render deployment failed health verification"
          exit 1
          

permissions:
  contents: read
  packages: write

