name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests and quality gates
        run: mvn clean verify -Dgit.commit=${{ github.sha }}

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with: jacoco-report
        path: target/site/jacoco
        if-no-files-found: warn

      - name: Upload OWASP Dependency-Check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: warn

      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: bcbs-member-platform
          path: target/*.jar
          if-no-files-found: error

      - name: Build Docker image
        run: docker build -t ghcr.io/undergroundhog/bcbs-member-platform:${{github.sha}} -t ghcr.io/undergroundhog/bcbs-member-platform:latest .

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        run: |
          docker push ghcr.io/undergroundhog/bcbs-member-platform:${{github.sha}}
          docker push ghcr.io/undergroundhog/bcbs-member-platform:latest

      - name: Deploy exact image to Render
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          curl --fail --show-error --silent \
          --get \
          --data-urlencode "imgURL=ghcr.io/undergroundhog/bcbs-member-platform:${{github.sha}}" \
          "${{ secrets.RENDER_STAGING_DEPLOY_HOOK_URL }}"
      
      - name: Verify exact Render deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: | 
          echo "Waiting for commit ${{ github.sha }} to become live in staging..."
          
          i=1
          while [ "$i" -le 30 ]; do
            INFO="$(curl -s 'https://bcbs-member-platform-staging.onrender.com/actuator/info' || true)"
            
            echo "Attempt $i"
            
            if echo "$INFO" | grep -q '"commit":"${{ github.sha }}"'; then
              echo "Exact commit is live in staging: ${{ github.sha }}"
              exit 0
            fi
            
            echo "Expected commit not live in staging yet."
            echo "Current response: $INFO"
          
            sleep 10
            i=$((i+1))
          done
        
          echo "Staging deployment verification failed."
          echo "Expected: ${{ github.sha }}"
          echo "Actual response: $INFO"
          exit 1
          

      - name: Package application
        run: mvn package -DskipTests

      - name: Verify build metadata in JAR
        run: |
          echo "Github SHA: ${{ github.sha }}"
          echo "Build info inside JAR:"
          unzip -p target/*.jar META-INF/build-info.properties
      
      
          

permissions:
  contents: read
  packages: write

